name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Run tests
        run: go test ./... -count=1

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build all platforms
        run: |
          LDFLAGS="-s -w -X main.version=${{ env.VERSION }}"
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o forge-darwin-amd64    ./cmd/
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o forge-darwin-arm64    ./cmd/
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o forge-linux-amd64     ./cmd/
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o forge-linux-arm64     ./cmd/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o forge-windows-amd64.exe ./cmd/

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/forge-darwin-amd64.tar.gz   forge-darwin-amd64
          tar czf dist/forge-darwin-arm64.tar.gz   forge-darwin-arm64
          tar czf dist/forge-linux-amd64.tar.gz    forge-linux-amd64
          tar czf dist/forge-linux-arm64.tar.gz    forge-linux-arm64
          zip     dist/forge-windows-amd64.zip      forge-windows-amd64.exe
          cd dist && sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to npm
        working-directory: npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"
          npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
