name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o forge ./cmd/

      - name: Unit tests
        # -timeout bounds each package's test binary so a hang panics with a
        # full goroutine dump instead of silently consuming the job's whole
        # timeout-minutes budget. timeout-minutes is the hard backstop: a Go
        # test timeout only panics the test binary itself, it doesn't run
        # t.Cleanup on a goroutine that's blocked (not merely slow), so a
        # spawned daemon process can outlive it — the job-level timeout is
        # what actually reclaims the runner in that case.
        run: go test ./... -v -count=1 -timeout 300s

      - name: Coverage gate (internal/service >= 65%)
        run: |
          go test ./internal/service -coverprofile=service.cover.out -covermode=atomic -count=1
          go tool cover -func=service.cover.out | awk '/^total:/ { gsub("%","",$3); if (($3+0) < 65) { printf("internal/service coverage %.1f%% is below 65%%\n", $3+0); exit 1 } else { printf("internal/service coverage %.1f%%\n", $3+0) } }'

      - name: Lint
        run: go vet ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            suffix: ''
          - os: darwin
            arch: arm64
            suffix: ''
          - os: linux
            arch: amd64
            suffix: ''
          - os: linux
            arch: arm64
            suffix: ''
          - os: windows
            arch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -o forge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} ./cmd/

      - name: Check binary size
        run: ls -lh forge-*

  test-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    # This job has hung for 35-64 minutes on multiple unrelated commits
    # (pre-dating any coach/knowledgegap work) before eventually failing —
    # almost certainly a daemon (or its own spawned subprocess) leaking a
    # handle that keeps something waiting for EOF that never comes. The
    # go test -timeout below only bounds the test binary itself; it can't
    # run a blocked test's t.Cleanup, so it can't guarantee the spawned
    # daemon process actually gets killed. This is the real backstop: the
    # runner reclaims the whole job, orphaned processes included, once this
    # fires.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o forge.exe ./cmd/

      - name: Unit tests
        shell: pwsh
        run: |
          # Write output to a temp file instead of a pipe (Tee-Object). Using a pipe
          # causes daemon grandchild processes (spawned by integration tests via
          # "forge start") to inherit the pipe's write handle. Those daemons outlive
          # "go test" and keep the pipe open, blocking PowerShell indefinitely.
          # A temp file has no such "all-writers-must-close" semantics.
          #
          # Tests run per-package, with a process sweep between each one, rather
          # than a single "go test ./..." invocation. go test's own -timeout only
          # kills the test binary; it can't run a blocked test's t.Cleanup, so a
          # spawned daemon can outlive it and hold a stale socket/port that makes
          # an UNRELATED later package's tests hang too — turning one leaked
          # process into what looks like the whole suite stalling for the job's
          # entire 15-minute budget instead of one package's 240s timeout.
          $ErrorActionPreference = 'Stop'
          $packages = go list ./...
          $failed = $false
          foreach ($pkg in $packages) {
            $tmpLog = [System.IO.Path]::GetTempFileName()
            try {
              go test $pkg -v -count=1 -parallel 1 -timeout 240s > $tmpLog 2>&1
              $ec = $LASTEXITCODE
              $captured = Get-Content $tmpLog -Raw
              Write-Host $captured
              # Only propagate failure for real test failures — lines like "FAIL\tpkg".
              # The bare "FAIL" at the end of go test output is not a real test failure.
              if (($ec -ne 0) -and ($captured -match "(?m)^FAIL\t")) { $failed = $true }
            } finally {
              Remove-Item $tmpLog -ErrorAction SilentlyContinue
            }
            Get-Process -Name "forge*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ($failed) { exit 1 }
          exit 0

  integration-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o forge.exe ./cmd/

      - name: Integration test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Forge {
            param(
              [string[]]$ForgeArgs,
              [string]$InputText
            )

            if ($PSBoundParameters.ContainsKey('InputText')) {
              $output = $InputText | & .\forge.exe @ForgeArgs 2>&1
            } else {
              $output = & .\forge.exe @ForgeArgs 2>&1
            }

            $output | Out-Host
            if ($LASTEXITCODE -ne 0) {
              throw "forge.exe $($ForgeArgs -join ' ') failed with exit code $LASTEXITCODE"
            }

            return ($output | Out-String)
          }

          $forgeHome = Join-Path $env:USERPROFILE '.forge'
          if (Test-Path $forgeHome) {
            Remove-Item -Recurse -Force $forgeHome
          }

          $savedSourceTool = $env:FORGE_SOURCE_TOOL
          $savedEventType = $env:FORGE_EVENT_TYPE

          try {
            Invoke-Forge -ForgeArgs @('init')
            Invoke-Forge -ForgeArgs @('start')

            $status = ''
            $running = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $status = Invoke-Forge -ForgeArgs @('status', '--json')
              $statusObj = $status | ConvertFrom-Json
              if ($statusObj.daemon -eq 'running') {
                $running = $true
                break
              }
            }

            if (-not $running) {
              Invoke-Forge -ForgeArgs @('doctor')
              throw "daemon did not reach the running state after start"
            }

            $doctor = Invoke-Forge -ForgeArgs @('doctor')
            if ($doctor -notmatch '\[OK\] Daemon') {
              throw "doctor did not report a healthy daemon"
            }

            $env:FORGE_SOURCE_TOOL = 'claude'
            $env:FORGE_EVENT_TYPE = 'PostToolUse'
            Invoke-Forge -ForgeArgs @('hook') -InputText '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"echo test"}}'
            Start-Sleep -Milliseconds 500
            Invoke-Forge -ForgeArgs @('hook') -InputText '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Edit","tool_input":{"file_path":"test.go"}}'
            Start-Sleep -Milliseconds 500

            $status = Invoke-Forge -ForgeArgs @('status', '--json')
            $statusObj = $status | ConvertFrom-Json
            if ($statusObj.events.total -ne 2) {
              throw "expected 2 captured events after hook calls"
            }
          } catch {
            Write-Host "Integration test failed! Printing daemon log:"
            $logFile = Join-Path $forgeHome 'daemon.log'
            if (Test-Path $logFile) {
              Get-Content $logFile
            } else {
              Write-Host "No daemon.log found"
            }
            throw
          } finally {
            if ($null -ne $savedSourceTool) {
              $env:FORGE_SOURCE_TOOL = $savedSourceTool
            } else {
              Remove-Item Env:FORGE_SOURCE_TOOL -ErrorAction SilentlyContinue
            }

            if ($null -ne $savedEventType) {
              $env:FORGE_EVENT_TYPE = $savedEventType
            } else {
              Remove-Item Env:FORGE_EVENT_TYPE -ErrorAction SilentlyContinue
            }

            Invoke-Forge -ForgeArgs @('stop')
          }

          $finalStatus = Invoke-Forge -ForgeArgs @('status', '--json')
          $finalStatusObj = $finalStatus | ConvertFrom-Json
          if ($finalStatusObj.daemon -ne 'not running') {
            throw "daemon should not be running after stop"
          }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o forge ./cmd/

      - name: Integration test
        run: |
          # Clean slate
          rm -rf ~/.forge
          
          # Init
          ./forge init
          
          # Start daemon
          ./forge start
          sleep 2
          
          # Check daemon is running
          ./forge status | grep "Daemon:.*running"
          
          # Send test events
          echo '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"echo test"}}' | \
            FORGE_SOURCE_TOOL=claude FORGE_EVENT_TYPE=PostToolUse ./forge hook
          sleep 0.5
          
          echo '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Edit","tool_input":{"file_path":"test.go"}}' | \
            FORGE_SOURCE_TOOL=claude FORGE_EVENT_TYPE=PostToolUse ./forge hook
          sleep 0.5
          
          # Verify events captured
          ./forge status | grep "Events:.*2"
          
          # Distill
          ./forge distill
          
          # Test MCP server
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_recent_context","arguments":{}}}' | \
            ./forge mcp 2>/dev/null | grep -q "forge"
          
          # Test search
          ./forge search "test" | grep -q "PostToolUse"
          
          # Stop daemon
          ./forge stop
          
          echo "Integration test passed!"
