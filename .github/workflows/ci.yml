name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o forge ./cmd/

      - name: Unit tests
        run: go test ./... -v -count=1

      - name: Lint
        run: go vet ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            suffix: ''
          - os: darwin
            arch: arm64
            suffix: ''
          - os: linux
            arch: amd64
            suffix: ''
          - os: linux
            arch: arm64
            suffix: ''
          - os: windows
            arch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -o forge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} ./cmd/

      - name: Check binary size
        run: ls -lh forge-*

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o forge.exe ./cmd/

      - name: Unit tests
        shell: pwsh
        run: |
          go test ./... -v -count=1 -timeout 120s 2>&1 | Tee-Object -Variable captured
          $ec = $LASTEXITCODE
          # On Windows, go test exits 1 when it cannot delete the test binary after a
          # successful run (OS file lock). Propagate failure only for real test failures
          # (lines starting with "FAIL "). Must explicit exit 0 so pwsh doesn't
          # propagate go test's $LASTEXITCODE as the step exit code.
          if (($ec -ne 0) -and ($captured -match "(?m)^FAIL\s")) { exit 1 }
          exit 0

  integration-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o forge.exe ./cmd/

      - name: Integration test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Forge {
            param(
              [string[]]$ForgeArgs,
              [string]$InputText
            )

            if ($PSBoundParameters.ContainsKey('InputText')) {
              $output = $InputText | & .\forge.exe @ForgeArgs 2>&1
            } else {
              $output = & .\forge.exe @ForgeArgs 2>&1
            }

            $output | Out-Host
            if ($LASTEXITCODE -ne 0) {
              throw "forge.exe $($ForgeArgs -join ' ') failed with exit code $LASTEXITCODE"
            }

            return ($output | Out-String)
          }

          $forgeHome = Join-Path $env:USERPROFILE '.forge'
          if (Test-Path $forgeHome) {
            Remove-Item -Recurse -Force $forgeHome
          }

          $savedSourceTool = $env:FORGE_SOURCE_TOOL
          $savedEventType = $env:FORGE_EVENT_TYPE

          try {
            Invoke-Forge -ForgeArgs @('init')
            Invoke-Forge -ForgeArgs @('start')

            $status = ''
            $running = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $status = Invoke-Forge -ForgeArgs @('status')
              if ($status -match 'Daemon:\s+running') {
                $running = $true
                break
              }
            }

            if (-not $running) {
              Invoke-Forge -ForgeArgs @('doctor')
              throw "daemon did not reach the running state after start"
            }

            $doctor = Invoke-Forge -ForgeArgs @('doctor')
            if ($doctor -notmatch '\[OK\] Daemon') {
              throw "doctor did not report a healthy daemon"
            }

            $env:FORGE_SOURCE_TOOL = 'claude'
            $env:FORGE_EVENT_TYPE = 'PostToolUse'
            Invoke-Forge -ForgeArgs @('hook') -InputText '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"echo test"}}'
            Start-Sleep -Milliseconds 500
            Invoke-Forge -ForgeArgs @('hook') -InputText '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Edit","tool_input":{"file_path":"test.go"}}'
            Start-Sleep -Milliseconds 500

            $status = Invoke-Forge -ForgeArgs @('status')
            if ($status -notmatch 'Events:\s+2') {
              throw "expected 2 captured events after hook calls"
            }
          } finally {
            if ($null -ne $savedSourceTool) {
              $env:FORGE_SOURCE_TOOL = $savedSourceTool
            } else {
              Remove-Item Env:FORGE_SOURCE_TOOL -ErrorAction SilentlyContinue
            }

            if ($null -ne $savedEventType) {
              $env:FORGE_EVENT_TYPE = $savedEventType
            } else {
              Remove-Item Env:FORGE_EVENT_TYPE -ErrorAction SilentlyContinue
            }

            Invoke-Forge -ForgeArgs @('stop')
          }

          $finalStatus = Invoke-Forge -ForgeArgs @('status')
          if ($finalStatus -notmatch 'Daemon:\s+not running') {
            throw "daemon should not be running after stop"
          }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o forge ./cmd/

      - name: Integration test
        run: |
          # Clean slate
          rm -rf ~/.forge
          
          # Init
          ./forge init
          
          # Start daemon
          ./forge start
          sleep 2
          
          # Check daemon is running
          ./forge status | grep "Daemon:.*running"
          
          # Send test events
          echo '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"echo test"}}' | \
            FORGE_SOURCE_TOOL=claude FORGE_EVENT_TYPE=PostToolUse ./forge hook
          sleep 0.5
          
          echo '{"session_id":"ci-test","hook_event_name":"PostToolUse","tool_name":"Edit","tool_input":{"file_path":"test.go"}}' | \
            FORGE_SOURCE_TOOL=claude FORGE_EVENT_TYPE=PostToolUse ./forge hook
          sleep 0.5
          
          # Verify events captured
          ./forge status | grep "Events:.*2"
          
          # Distill
          ./forge distill
          
          # Test MCP server
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_recent_context","arguments":{}}}' | \
            ./forge mcp 2>/dev/null | grep -q "forge"
          
          # Test search
          ./forge search "test" | grep -q "PostToolUse"
          
          # Stop daemon
          ./forge stop
          
          echo "Integration test passed!"
